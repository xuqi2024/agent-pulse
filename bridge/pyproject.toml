[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pulse"
version = "0.1.0"
description = "Host-side bridge: feed AI agent status to the SZPI-ESP32S3 status display"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "watchdog>=3.0",
    "Pillow>=10.0",
]

[project.scripts]
agent-pulse = "agent_pulse_bridge:main"
ap-cli = "ap_cli:main"

[tool.setuptools]
py-modules = ["agent_pulse_bridge", "ap_cli"]

[tool.setuptools.packages.find]
include = ["agent_pulse*"]
